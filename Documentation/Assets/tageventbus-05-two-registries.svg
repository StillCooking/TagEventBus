<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Two disjoint TagEventBus registries</title>
  <desc id="d">The Scope pin selects a registry: Global is UTagEventBusSubsystem on the GameInstance, Local is UTagEventBusComponent on an actor. Each registry has its own sender and listener, and events never cross between them.</desc>
  <defs>
    <marker id="a-teal" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#5ec4d4"/></marker>
    <marker id="a-lav" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#9070d0"/></marker>
    <marker id="a-rose" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#e06090"/></marker>
  </defs>
  <rect width="900" height="440" rx="10" fill="#121216"/>

  <rect x="402" y="16" width="96" height="32" rx="6" fill="#e8a838" fill-opacity="0.12" stroke="#e8a838" stroke-opacity="0.8"/>
  <text x="450" y="37" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#e8a838">Scope</text>

  <polyline points="440,48 440,66 216,66 216,80" fill="none" stroke="#5ec4d4" stroke-width="1.6" marker-end="url(#a-teal)"/>
  <text x="300" y="60" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#5ec4d4">Global</text>
  <polyline points="460,48 460,66 684,66 684,80" fill="none" stroke="#9070d0" stroke-width="1.6" marker-end="url(#a-lav)"/>
  <text x="600" y="60" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#9070d0">Local</text>

  <rect x="44" y="84" width="344" height="320" rx="10" fill="#5ec4d4" fill-opacity="0.045" stroke="#5ec4d4" stroke-opacity="0.5"/>
  <text x="64" y="116" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.6" fill="#5ec4d4">GLOBAL SCOPE</text>
  <text x="64" y="140" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="14" fill="#e8e8f0">UTagEventBusSubsystem</text>
  <text x="64" y="160" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#808090">on the GameInstance</text>
  <line x1="64" y1="176" x2="368" y2="176" stroke="#ffffff" stroke-opacity="0.08"/>

  <rect x="114" y="196" width="204" height="44" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.55"/>
  <text x="216" y="223" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="14" fill="#c8c8d0">Sender</text>

  <line x1="216" y1="240" x2="216" y2="268" stroke="#5ec4d4" stroke-width="1.6" marker-end="url(#a-teal)"/>
  <text x="228" y="259" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#5ec4d4">Broadcast</text>

  <rect x="84" y="272" width="264" height="52" rx="6" fill="#5ec4d4" fill-opacity="0.1" stroke="#5ec4d4" stroke-opacity="0.85"/>
  <text x="216" y="294" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="13.5" fill="#e8e8f0">Channel registry</text>
  <text x="216" y="312" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#808090">tag &#8594; listeners</text>

  <line x1="216" y1="324" x2="216" y2="352" stroke="#5ec4d4" stroke-width="1.6" marker-end="url(#a-teal)"/>
  <text x="228" y="343" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#5ec4d4">Delivery</text>

  <rect x="114" y="354" width="204" height="44" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.55"/>
  <text x="216" y="381" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="14" fill="#c8c8d0">Listener</text>

  <rect x="512" y="84" width="344" height="320" rx="10" fill="#9070d0" fill-opacity="0.045" stroke="#9070d0" stroke-opacity="0.5"/>
  <text x="532" y="116" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.6" fill="#9070d0">LOCAL SCOPE</text>
  <text x="532" y="140" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="14" fill="#e8e8f0">UTagEventBusComponent</text>
  <text x="532" y="160" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#808090">on an Actor</text>
  <line x1="532" y1="176" x2="836" y2="176" stroke="#ffffff" stroke-opacity="0.08"/>

  <rect x="582" y="196" width="204" height="44" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.55"/>
  <text x="684" y="223" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="14" fill="#c8c8d0">Sender</text>

  <line x1="684" y1="240" x2="684" y2="268" stroke="#9070d0" stroke-width="1.6" marker-end="url(#a-lav)"/>
  <text x="696" y="259" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#9070d0">Broadcast</text>

  <rect x="552" y="272" width="264" height="52" rx="6" fill="#9070d0" fill-opacity="0.1" stroke="#9070d0" stroke-opacity="0.85"/>
  <text x="684" y="294" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="13.5" fill="#e8e8f0">Channel registry</text>
  <text x="684" y="312" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#808090">tag &#8594; listeners</text>

  <line x1="684" y1="324" x2="684" y2="352" stroke="#9070d0" stroke-width="1.6" marker-end="url(#a-lav)"/>
  <text x="696" y="343" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11.5" fill="#9070d0">Delivery</text>

  <rect x="582" y="354" width="204" height="44" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.55"/>
  <text x="684" y="381" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="14" fill="#c8c8d0">Listener</text>

  <text x="450" y="268" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="12.5" fill="#e06090">never crosses</text>
  <line x1="434" y1="298" x2="398" y2="298" stroke="#e06090" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-rose)"/>
  <line x1="466" y1="298" x2="502" y2="298" stroke="#e06090" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a-rose)"/>
  <circle cx="450" cy="298" r="15" fill="#121216" stroke="#e06090" stroke-width="1.6"/>
  <line x1="443" y1="291" x2="457" y2="305" stroke="#e06090" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="457" y1="291" x2="443" y2="305" stroke="#e06090" stroke-width="2.2" stroke-linecap="round"/>
</svg>
