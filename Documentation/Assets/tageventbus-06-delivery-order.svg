<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">TagEventBus delivery order</title>
  <desc id="d">A broadcast on Combat.Hit.Critical is handled lane by lane: first the whole exact channel Combat.Hit.Critical in descending Priority, then the ancestor Combat.Hit, then Combat, both for Match = Partial only. Priority orders listeners inside a lane, never between lanes.</desc>
  <defs>
    <marker id="b-teal" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#5ec4d4"/></marker>
    <marker id="b-lav" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#9070d0"/></marker>
    <marker id="b-rose" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#e06090"/></marker>
    <marker id="b-slate" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#8a8a9a"/></marker>
  </defs>
  <rect width="900" height="520" rx="10" fill="#121216"/>

  <rect x="32" y="78" width="180" height="56" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.6"/>
  <text x="122" y="100" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.6" fill="#808090">BROADCAST</text>
  <text x="122" y="121" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="12.5" fill="#e8e8f0">Combat.Hit.Critical</text>
  <line x1="212" y1="106" x2="244" y2="106" stroke="#8a8a9a" stroke-width="1.8" marker-end="url(#b-slate)"/>

  <rect x="250" y="40" width="618" height="132" rx="10" fill="#5ec4d4" fill-opacity="0.045" stroke="#5ec4d4" stroke-opacity="0.5"/>
  <rect x="264" y="56" width="26" height="26" rx="5" fill="#5ec4d4" fill-opacity="0.16" stroke="#5ec4d4" stroke-opacity="0.8"/>
  <text x="277" y="74" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#5ec4d4">1</text>
  <text x="302" y="74" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#e8e8f0">Combat.Hit.Critical</text>
  <text x="302" y="92" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="11.5" fill="#5ec4d4">exact channel &#183; Match = Exact &#183; descending Priority</text>
  <rect x="282" y="114" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="371" y="134" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener A</text><text x="371" y="151" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Priority 100</text>
  <line x1="460" y1="138" x2="472" y2="138" stroke="#5ec4d4" stroke-width="1.6" marker-end="url(#b-teal)"/>
  <rect x="474" y="114" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="563" y="134" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener B</text><text x="563" y="151" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Priority 50</text>
  <line x1="652" y1="138" x2="664" y2="138" stroke="#5ec4d4" stroke-width="1.6" marker-end="url(#b-teal)"/>
  <rect x="666" y="114" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="755" y="134" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener C</text><text x="755" y="151" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Priority 0</text>

  <line x1="277" y1="174" x2="277" y2="202" stroke="#e06090" stroke-width="1.8" marker-end="url(#b-rose)"/>
  <text x="292" y="193" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="11.5" fill="#e06090">only after lane 1 is exhausted</text>

  <rect x="250" y="206" width="618" height="120" rx="10" fill="#9070d0" fill-opacity="0.045" stroke="#9070d0" stroke-opacity="0.5"/>
  <rect x="264" y="222" width="26" height="26" rx="5" fill="#9070d0" fill-opacity="0.16" stroke="#9070d0" stroke-opacity="0.8"/>
  <text x="277" y="240" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#9070d0">2</text>
  <text x="302" y="240" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#e8e8f0">Combat.Hit</text>
  <text x="302" y="258" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="11.5" fill="#9070d0">ancestor &#183; Match = Partial only</text>
  <rect x="282" y="268" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="371" y="288" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener D</text><text x="371" y="305" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Match = Partial</text>
  <line x1="460" y1="292" x2="472" y2="292" stroke="#9070d0" stroke-width="1.6" marker-end="url(#b-lav)"/>
  <rect x="474" y="268" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="563" y="288" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener E</text><text x="563" y="305" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Match = Partial</text>

  <line x1="277" y1="328" x2="277" y2="356" stroke="#e06090" stroke-width="1.8" marker-end="url(#b-rose)"/>
  <text x="292" y="347" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="11.5" fill="#e06090">only after lane 2 is exhausted</text>

  <rect x="250" y="360" width="618" height="120" rx="10" fill="#9070d0" fill-opacity="0.045" stroke="#9070d0" stroke-opacity="0.5"/>
  <rect x="264" y="376" width="26" height="26" rx="5" fill="#9070d0" fill-opacity="0.16" stroke="#9070d0" stroke-opacity="0.8"/>
  <text x="277" y="394" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#9070d0">3</text>
  <text x="302" y="394" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="13" fill="#e8e8f0">Combat</text>
  <text x="302" y="412" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="11.5" fill="#9070d0">ancestor &#183; Match = Partial only</text>
  <rect x="282" y="422" width="178" height="48" rx="6" fill="none" stroke="#8a8a9a" stroke-opacity="0.5"/><text x="371" y="442" text-anchor="middle" font-family="&#34;Inter&#34;,system-ui,-apple-system,&#34;Segoe UI&#34;,Roboto,sans-serif" font-size="12.5" fill="#c8c8d0">Listener F</text><text x="371" y="459" text-anchor="middle" font-family="ui-monospace,&#34;JetBrains Mono&#34;,&#34;Cascadia Mono&#34;,Menlo,Consolas,monospace" font-size="11" fill="#808090">Match = Partial</text>
